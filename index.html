<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miguel Angel Andrades - To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <div class="todo-container">
      <h1>To-Do App</h1>

      <p>Organiza tus tareas y marca tu progreso.</p>

      <p id="task-counter">  Pendientes: 0 | Completadas: 0 </p>

      <div class="todo-form">
        <input 
          type="text" 
          id="todo-input" 
          placeholder="Escribe una tarea..."
        >

        <button id="add-task-btn">Añadir tarea</button>
      </div>

      <ul id="todo-list"></ul>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
